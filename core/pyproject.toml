[project]
name = "sannen-core"
version = "0.1.0"
description = "Lõi tính khối lượng san nền — deterministic, không phụ thuộc AutoCAD"
requires-python = ">=3.10"
dependencies = ["ezdxf>=1.3", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
sannen = "sannen.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
