# Lệnh khởi tạo dạng file. Người điền, agent đọc. Thiếu trường nào lõi hỏi đúng trường đó.
ma_lo: 01-CGP
ten_lo: Lô 01-CGP
dot: 1
he_toa_do: VN-2000
don_vi: m
phuong_phap_chinh_thuc: luoi_o_vuong

# Nguồn điểm: lấy trực tiếp từ 2 bản vẽ DXF trước và sau san lấp (layer "point", 604 điểm mốc, 413 điểm đo).
be_mat_moc:
  nguon: dxf_layer
  file: BẢN VẼ BIÊN TẬP TSL-01-CGP.dxf
  layer: point
be_mat_do:
  nguon: dxf_layer
  file: ssl01-cgp.dxf
  layer: point

# QUYẾT ĐỊNH CỦA NGƯỜI (24/11/2026): loại bỏ 11 điểm nghi vấn cao độ bất thường (V-01..V-11 -> b).
bo_diem:
  - MOC-00020
  - MOC-00132
  - MOC-00136
  - MOC-00300
  - MOC-00387
  - DO-00001
  - DO-00021
  - DO-00049
  - DO-00058
  - DO-00344
  - DO-00360

# QUYẾT ĐỊNH CỦA NGƯỜI (23/11/2026): biên lô = biên vùng san lấp, đa tuyến khép kín 74 đỉnh trên layer "0"
# của ssl01-cgp.dxf (4.974 m²). Bản vẽ nhà thầu chưa gán layer SN-BIENLO và agent không được sửa 00_input.
bien_lo:
  nguon: dxf_polyline
  file: ssl01-cgp.dxf
  layer: "0"
  so_dinh: 74

luoi:
  kich_thuoc_o_m: 20
  goc_xoay_do: 0
  # goc_luoi: [445000.0, 1113000.0]   # bỏ trống thì tool tự đặt vừa biên lô
  # QUYẾT ĐỊNH CỦA NGƯỜI (23/11/2026): vùng thiếu dữ liệu lấy cao độ của ĐIỂM ĐO gần nhất để bù (RULES 8: người chấp nhận).
  # Mọi ô có đỉnh bù đều mang cờ `ngoai_suy` trong grid.json, volume.json và việc cảnh báo.
  ngoai_suy_m: 25           # giới hạn khoảng cách tìm điểm đo gần nhất (đo thực tế cần tối đa 23,35 m)
  ngoai_suy_kieu: diem_gan_nhat

# he_so_dam_chat: 1.0     # k trong V_đắp = k × V_đào, theo thí nghiệm đầm chặt

# Khi khảo sát giao Excel/CSV thay vì bản vẽ, đổi nguồn của bề mặt tương ứng:
#   be_mat_moc: {nguon: excel, file: ten_file.xlsx, sheet: Sheet1}   # sheet bỏ trống = tự dò
# Ánh xạ cột: khai ở đây, hoặc để trống — `nhap` sẽ đề xuất, người xác nhận một lần
# bằng --xac-nhan-anh-xa và lõi nhớ trong anh_xa_cot.yaml (xem skills/nhap/SKILL.md).
# Ánh xạ cột khi khảo sát giao Excel thay vì bản vẽ.
# File lô 01-CGP có 7 dòng tiêu đề và XẾP HAI KHỐI ĐIỂM trên mỗi dòng (cột 1-5 và 6-10).
anh_xa_cot_excel:
  id: Tên điểm
  northing: Tọa độ X(m)      # X là NORTHING (~1.113.000)
  easting: Tọa độ Y(m)       # Y là EASTING  (~445.000)
  z: Cao độ H(m)
  code: Ghi chú

